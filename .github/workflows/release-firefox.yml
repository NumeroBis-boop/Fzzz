name: Release (Firefox)

# Publie une version Firefox auto-distribuée, mise à jour automatiquement :
#  1. signature « non listée » par addons.mozilla.org (pas de fiche publique) ;
#  2. release GitHub vX.Y.Z avec le .xpi signé et updates.json ;
#  3. les Firefox installés lisent update_url (wxt.config.ts), qui pointe vers
#     le updates.json de la dernière release, et installent la nouvelle version.
# Déclenchement : push d'un tag vX.Y.Z, ou « Run workflow » (version de package.json).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WXT >= 0.21 exige Node 22 : `bun run wxt` lance le bin `wxt` sous Node
      # (shebang), pas sous Bun. Les runners GitHub sont encore en Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: |
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($MANIFEST_VERSION)."
              exit 1
            fi
          fi
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: bun run compile

      - name: Build & zip (Firefox)
        run: bun run zip:firefox

      - name: Sign on AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          V="${{ steps.version.outputs.version }}"
          npx --yes web-ext@8 sign \
            --channel=unlisted \
            --source-dir=.output/firefox-mv3 \
            --upload-source-code=".output/fzzz-${V}-sources.zip" \
            --artifacts-dir=signed \
            --approval-timeout=1800000
          XPI=$(ls signed/*.xpi | head -n 1)
          mv "$XPI" ".output/fzzz-${V}.xpi"
          # copie au nom fixe : le bouton « Mettre à jour Fzzz » ouvre
          # releases/latest/download/fzzz.xpi (toujours la dernière version)
          cp ".output/fzzz-${V}.xpi" .output/fzzz.xpi

      - name: Update manifest for Firefox (updates.json)
        run: |
          V="${{ steps.version.outputs.version }}"
          cat > .output/updates.json <<JSON
          {
            "addons": {
              "fzzz@numerobis-boop.github.io": {
                "updates": [
                  {
                    "version": "${V}",
                    "update_link": "https://github.com/NumeroBis-boop/Fzzz/releases/download/v${V}/fzzz-${V}.xpi"
                  }
                ]
              }
            }
          }
          JSON
          node -e "JSON.parse(require('fs').readFileSync('.output/updates.json','utf8'))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            .output/fzzz-*.xpi
            .output/fzzz.xpi
            .output/updates.json
            .output/fzzz-*-firefox.zip
            .output/fzzz-*-sources.zip
