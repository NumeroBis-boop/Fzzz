<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Chien content (et un peu idiot)</title>
  <!-- oreilles qui volent -->
  <path d="M42 62 C10 40 8 95 30 112 C40 98 46 82 52 70 Z" fill="#8a5a2b"/>
  <path d="M158 62 C190 36 196 92 172 108 C162 96 154 82 148 70 Z" fill="#8a5a2b"/>
  <!-- tête -->
  <ellipse cx="100" cy="100" rx="62" ry="58" fill="#e8c38f"/>
  <!-- tache sur l'œil -->
  <ellipse cx="128" cy="80" rx="22" ry="20" fill="#c99a5e"/>
  <!-- yeux qui louchent : tailles différentes, pupilles vers le nez -->
  <circle cx="74" cy="80" r="16" fill="#fff" stroke="#3a2a0c" stroke-width="2"/>
  <circle cx="82" cy="84" r="7" fill="#3a2a0c"/>
  <circle cx="84" cy="81" r="2" fill="#fff"/>
  <circle cx="128" cy="78" r="11" fill="#fff" stroke="#3a2a0c" stroke-width="2"/>
  <circle cx="121" cy="73" r="5" fill="#3a2a0c"/>
  <circle cx="122" cy="71" r="1.5" fill="#fff"/>
  <!-- sourcils en l'air -->
  <path d="M58 58 Q72 48 88 56" stroke="#3a2a0c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M116 60 Q128 50 142 58" stroke="#3a2a0c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- museau -->
  <ellipse cx="100" cy="122" rx="34" ry="24" fill="#f5dcb4"/>
  <ellipse cx="100" cy="106" rx="11" ry="8" fill="#3a2a0c"/>
  <ellipse cx="96" cy="104" rx="3" ry="2" fill="#7a6a5a"/>
  <!-- grand sourire de travers -->
  <path d="M72 122 Q100 152 130 118" stroke="#3a2a0c" stroke-width="3" fill="#7a2a1a" stroke-linecap="round"/>
  <!-- langue qui pend sur le côté -->
  <path d="M104 134 C102 156 112 170 122 166 C132 162 128 146 122 132 Z" fill="#e8607a" stroke="#b03a52" stroke-width="2"/>
  <path d="M114 140 L118 160" stroke="#b03a52" stroke-width="2" stroke-linecap="round"/>
  <!-- goutte de bave -->
  <path d="M84 132 Q80 146 84 150 Q88 146 84 132 Z" fill="#bfe3ff" stroke="#7fb0d8" stroke-width="1"/>
  <!-- étoiles de joie -->
  <path d="M28 30 l4 8 8 1 -6 5 2 8 -8 -4 -8 4 2 -8 -6 -5 8 -1 Z" fill="#f6c343"/>
  <path d="M168 24 l3 6 6 1 -4 4 1 6 -6 -3 -6 3 1 -6 -4 -4 6 -1 Z" fill="#f6c343"/>
</svg>
