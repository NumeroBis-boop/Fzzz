name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WXT >= 0.21 exige Node 22 : `bun run wxt` lance le bin `wxt` sous Node
      # (shebang), pas sous Bun. Les runners GitHub sont encore en Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run compile

      - name: Check JS (fichiers marqués // @ts-check)
        run: bun run check:js

      - name: Tests
        run: bun run test

      - name: Build zips
        run: |
          bun run zip
          bun run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: fzzz-extension
          path: .output/*.zip
