name: Extension

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @fzzz/extension zip
      - run: pnpm --filter @fzzz/extension zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: fzzz-extension
          path: apps/extension/.output/*.zip
      - name: Joindre les archives à la version publiée
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" apps/extension/.output/*.zip --clobber
