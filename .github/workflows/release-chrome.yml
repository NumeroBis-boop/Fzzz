name: Release (Chrome)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # publication sur le Chrome Web Store seulement si ses clés sont configurées
      HAS_CWS: ${{ secrets.CHROME_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      # WXT >= 0.21 exige Node 22 : `bun run wxt` lance le bin `wxt` sous Node
      # (shebang), pas sous Bun. Les runners GitHub sont encore en Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version
        id: version
        run: |
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($MANIFEST_VERSION)."
              exit 1
            fi
          fi
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: bun run compile

      - name: Build & zip (Chrome)
        run: bun run zip

      # Chrome n'accepte les mises à jour automatiques que depuis le Chrome Web
      # Store : la fiche peut être « non répertoriée » (installable par lien seulement).
      - name: Submit to Chrome Web Store
        if: env.HAS_CWS == 'true'
        # Chrome Web Store API v2 (service account); v1 shuts down on 15 Oct 2026.
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          bun run wxt submit \
            --chrome-zip ".output/fzzz-${{ steps.version.outputs.version }}-chrome.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            .output/fzzz-*-chrome.zip
